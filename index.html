<!doctype html>
<html lang="en">
  <head>
    <script type="module" src="common.mjs"></script>
    <script type="module" src="web.mjs" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Days Calendar Project</title>
  </head>
  <body>
    <h1>Days Calendar Project</h1>
    <main>
      <section>
        <div>
          <button id="previous-month-btn" style="padding: 10px">
            Previous Month
          </button>
          <button id="next-month-btn" style="padding: 10px">Next Month</button>
        </div>
        <div>
          <label for="month-select">Jump to Month</label>
          <select id="month-select"></select>
          <label for="year-select">Jump to Year</label>
          <select id="year-select"></select>
        </div>
      </section>

      <section>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>
    </main>
  </body>
</html>
